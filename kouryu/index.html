<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RVSS 現役メンバーとZoomで20分話す｜お申し込み</title>
<link rel="stylesheet" href="../assets/common.css">
<style>
  /* 日付ごとに時刻ボタンを並べる。20分刻みで5日先まで（最大100枠ほど）出るので、日付を横に送って選ぶ */
  .days { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; -webkit-overflow-scrolling: touch; }
  .days button { flex: 0 0 auto; width: auto; padding: 10px 14px; margin: 0; font-size: 15px;
                 background: #fff; color: #333; border: 1px solid #ccc; border-radius: 999px; }
  .days button.on { background: #06c755; color: #fff; border-color: #06c755; }
  .times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .times button { margin: 0; padding: 12px 0; font-size: 16px; background: #fff; color: #333;
                  border: 1px solid #ccc; border-radius: 10px; }
  .times button.on { background: #06c755; color: #fff; border-color: #06c755; }
  .picked { margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>
<div class="wrap">

  <div id="loading" class="loading">読み込んでいます…</div>
  <div id="boot-status" class="status" hidden></div>

  <div id="form-area" hidden>
    <!-- ★冒頭に RVSS のロゴ（9/25 守屋「フォームに画像」→「RVSSのロゴとかがいいな」）。
         画像＝assets/kouryu-logo.jpg（公式ロゴ 03_合同説明会/リール/logo/rvss_logo_official.png を、
         公式LINE画像と同じ濃紺の帯に載せたもの。ロゴの「REAL VALUE」が白文字なので白背景には直接置けない）。 -->
    <div class="hero">
      <img src="../assets/kouryu-logo.jpg"
           alt="REAL VALUE STUDENTS"
           width="900" height="300">
    </div>

    <h1 id="title">現役メンバーとZoomで20分話す</h1>
    <p class="lead">RVSSの現役メンバーと20分、Zoomで直接話せる場です。ご都合の良い時間帯を選んでください。</p>

    <div class="field">
      <label>ご希望の日時<span class="req">必須</span></label>
      <div id="days" class="days"></div>
      <div id="times" class="times"></div>
      <p id="picked" class="picked" hidden></p>
      <p id="noslot" class="note" hidden>いまお選びいただける時間がありません。時間をおいて開き直してください。</p>
    </div>

    <div class="field">
      <label for="name">お名前<span class="req">必須</span></label>
      <input type="text" id="name" autocomplete="name" placeholder="山田 太郎">
    </div>

    <div class="field">
      <label for="email">メールアドレス<span class="req">必須</span></label>
      <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="example@gmail.com">
    </div>

    <div class="field">
      <label for="school">大学・学年<span class="req">必須</span></label>
      <input type="text" id="school" placeholder="〇〇大学 〇〇学部 2年">
    </div>

    <button id="submit" type="button">この日時で申し込む</button>
    <div id="status" class="status" hidden></div>
  </div>

  <div id="done" class="done" hidden>
    <h2>お申し込みを受け付けました</h2>
    <p id="done-when"></p>
    <p>確認のメッセージをLINEでお送りします。開始の2時間前にも、参加リンクをLINEでお知らせします。</p>
  </div>

</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<!-- ★2026-09-29 情シス（井上さん）の訪問計測。#335 スレッドの手順どおり（watch の rvss-ondemand-visits と同じ型）。
     認証後のページ訪問を LINE userID で記録する。失敗しても申込・予約は止まらない。
     ★LINE のアクセストークンを情シスのサーバーへ渡すスクリプトなので、9/29 に中身を読んだ版に固定する（integrity）。
       情シスがスクリプトを更新したら、ここのハッシュを差し替えるまで計測だけ止まる（申込・予約は止まらない）。 -->
<script src="https://rvss-dx-ten.vercel.app/integrations/rvss-action-visits.js"
        integrity="sha384-bF87t8MAX1DVifpxK9/TfKPG757JY76E6FULbuWdrgOYCKdz3I5kXpXhimiy4AQ9"
        crossorigin="anonymous"></script>
<script src="../config.js"></script>
<script src="../assets/liff-common.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.RVSS_CONFIG;
  var KIND = '交流会';
  var profile = null, src = 'unknown', sending = false;
  var items = [], picked = null, day = null;

  var NAME = CFG.KOURYU_NAME || '現役メンバーとZoomで20分話す';
  document.title = 'RVSS ' + NAME + '｜お申し込み';
  document.getElementById('title').textContent = NAME;   // ★2026-09-29 「〜話すのお申し込み」にならないよう名前だけ

  /* GAS の doGet（?kind=交流会）から、いま申し込める枠を取る。
     ★枠は守屋のカレンダーの空きから GAS が計算する（開始12時間前まで・1枠に何人でも）。 */
  function load() {
    return new Promise(function (resolve, reject) {
      var cb = '__rvssKouryu' + Date.now();
      var s = document.createElement('script');
      var timer = setTimeout(function () { done(); reject(new Error('timeout')); }, 15000);
      function done() { clearTimeout(timer); try { delete window[cb]; } catch (e) {} if (s.parentNode) s.parentNode.removeChild(s); }
      window[cb] = function (j) { done(); resolve((j && j.items) || []); };
      s.src = CFG.GAS_ENDPOINT + '?callback=' + cb + '&kind=' + encodeURIComponent(KIND);
      s.onerror = function () { done(); reject(new Error('network')); };
      document.head.appendChild(s);
    });
  }

  function render() {
    var daysEl = document.getElementById('days');
    var timesEl = document.getElementById('times');
    daysEl.innerHTML = ''; timesEl.innerHTML = '';
    if (!items.length) { RVSS.show('noslot'); return; }
    RVSS.hide('noslot');

    var order = [], byDay = {};
    items.forEach(function (it) {
      if (!byDay[it.date]) { byDay[it.date] = []; order.push(it.date); }
      byDay[it.date].push(it);
    });
    if (!day || !byDay[day]) day = order[0];

    order.forEach(function (d) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = byDay[d][0].dateLabel;
      if (d === day) b.className = 'on';
      b.addEventListener('click', function () { day = d; render(); });
      daysEl.appendChild(b);
    });
    byDay[day].forEach(function (it) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = it.time;
      if (picked && picked.value === it.value) b.className = 'on';
      b.addEventListener('click', function () {
        picked = it;
        var p = document.getElementById('picked');
        p.textContent = '選択中：' + it.label;
        p.hidden = false;
        render();
      });
      timesEl.appendChild(b);
    });
  }

  /* ---------- 情シスの訪問計測（2026-09-29） ----------
     認証（liff.init）より前に作る＝ログイン画面へ飛ぶ前の ?src= を保持するため。 */
  var rvssVisitTracker = null;
  try {
    rvssVisitTracker = window.RVSSActionVisits.createTracker({
      endpoint: 'https://rvss-dx-ten.vercel.app/api/liff/visit',
      formType: 'discussion'
    });
  } catch (_) {
    console.warn('RVSS訪問計測を初期化できませんでした');
  }
  RVSS.boot({
    liffKey: 'kouryu',
    onReady: function (p, s) {
      profile = p; src = s;
      // 認証・プロフィール取得の直後に訪問を記録（情シスの訪問計測・画面表示や申込を待たせない）
      if (rvssVisitTracker) {
        rvssVisitTracker.record(window.liff)
          .then(function (result) {
            if (!result.ok) console.warn('RVSS訪問計測に失敗しました', result.status);
          })
          .catch(function () { console.warn('RVSS訪問計測に失敗しました'); });
      }
      RVSS.show('form-area');
      load().then(function (list) { items = list; render(); })
        .catch(function () { RVSS.setStatus('日時の読み込みに失敗しました。LINEアプリから開き直してください。', 'err'); });
    }
  });

  document.getElementById('submit').addEventListener('click', function () {
    if (sending) return;
    var name = document.getElementById('name').value.trim();
    var email = document.getElementById('email').value.trim();
    var school = document.getElementById('school').value.trim();
    if (!picked) { return RVSS.setStatus('ご希望の日時を選んでください。', 'err'); }
    if (!name) { return RVSS.setStatus('お名前を入力してください。', 'err'); }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { return RVSS.setStatus('メールアドレスの形式をご確認ください。', 'err'); }
    if (!school) { return RVSS.setStatus('大学・学年を入力してください。', 'err'); }

    sending = true;
    var btn = document.getElementById('submit');
    btn.disabled = true; btn.textContent = '送信しています…';
    RVSS.setStatus('空きを確認しています…', '');

    // ★送信の結果は画面から読めない（GAS は CORS を返さない＝liff-common.js の決めごと1）。
    //   ∴ 送る直前にもう一度枠を取り直し、選んだ枠がまだあるかをこちらで確かめる。
    load().then(function (list) {
      items = list;
      var still = list.some(function (it) { return it.value === picked.value; });
      if (!still) {
        sending = false; btn.disabled = false; btn.textContent = 'この日時で申し込む';
        picked = null; document.getElementById('picked').hidden = true; render();
        return RVSS.setStatus('選んだ時間は締め切られたか、埋まりました。別の時間を選んでください。', 'err');
      }
      RVSS.setStatus('送信しています…（20秒ほどかかることがあります。このままお待ちください）', '');
      return RVSS.postToGas({
        kind: 'kouryu',
        name: name,
        email: email,
        school: school,
        planDate: picked.value,
        src: src,
        lineUserId: (profile && profile.userId) || '',
        lineDisplayName: (profile && profile.displayName) || ''
      }, 45000).then(function () {
        RVSS.hide('form-area');
        document.getElementById('done-when').textContent = picked.label + '（20分・Zoom）';
        RVSS.show('done');
      });
    }).catch(function () {
      sending = false;
      btn.disabled = false; btn.textContent = 'もう一度送る';
      RVSS.setStatus('送信を確認できませんでした。もう一度お試しください。それでも進まない場合はLINEでお知らせください。', 'err');
    });
  });
})();
</script>
</body>
</html>
