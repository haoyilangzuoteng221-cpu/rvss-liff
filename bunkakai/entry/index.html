</head><body><div class="band"><img class="logo" src="../../assets/rvss-logo-official.png" alt="REAL VALUE STUDENTS" width="480" height="246"></div><main class="wrap">
<!-- 告知画像（広報が作る・テーマ2つを1枚）。届いたら src・width・height・alt を入れて hidden を外す。
     画像は WebP に縮めて liff/assets/ に置く（01_採用戦略/AI分科会_一斉配信_20261022/申込ページの画像を作る.py）。
     width・height を書いておくと、読み込み中も枠の高さが決まっていて画面がずれない。 -->
<figure id="hero" class="hero"><img src="../../assets/bunkakai-ai-hero.webp" width="1080" height="1424" alt="RVSS分科会 10/30と11/2の告知" decoding="async" fetchpriority="high"></figure>
<div id="preview-note" class="preview" hidden>確認用の画面です。押しても実際の申込は行いません。</div>
<header class="intro">
<h1>AI分科会</h1>
<p class="lead">オンライン・参加無料。<br>参加したい回を選んで、<br>下のボタンを押してください。</p></header>
<div id="loading" class="loading wait"><span class="spinner" aria-hidden="true"></span><p>日程を読み込んでいます。<br>少々お待ちください。</p></div><p id="boot-status" class="status" role="status" hidden></p>
<section id="form-area" class="entry-card" hidden>
<h2 id="pick-title" class="pick-title">参加する回を選んでください</h2><p id="pick-note" class="pick-note">両日の参加もできます。</p>
<div id="sessions" class="sessions"></div>
<p class="privacy">お名前はLINEの表示名で受け付けます。</p>
<!-- 申込ボタンは画面の下に固定して出し続ける（ページが長くても押せる） -->
<div class="join-bar"><p id="status" class="status" role="alert" hidden></p>
<button id="join" type="button" class="join" disabled>参加する</button>
<p class="join-note"><span>押すと、公式LINEに</span><span>日時と参加用のリンクが届きます。</span></p></div>
</section>
<section id="done" class="entry-card" hidden><div class="done-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
<h2 id="done-title">予約が完了しました</h2><ul id="done-list" class="done-list"></ul>
<p id="done-line">公式LINEに、<br>日時と参加用のリンクを送りました。</p>
<div id="fallback" hidden><p id="fallback-text"></p><div id="zoom-buttons"></div>
<a id="friend-link" class="sub-link" href="https://line.me/R/ti/p/@392huviq" hidden>公式LINEを友だち追加する</a></div>
<button id="add-more" type="button" class="sub-link" hidden>ほかの回も申し込む</button>
<p id="receipt" class="note"></p></section>
</main><footer class="band"><img class="logo" src="../../assets/rvss-logo-official.png" alt="REAL VALUE STUDENTS" width="480" height="246"></footer>
