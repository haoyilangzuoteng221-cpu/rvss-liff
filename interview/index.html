<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RVSS カジュアル面談の日程調整</title>
<link rel="stylesheet" href="../assets/common.css">
</head>
<body>
<div class="wrap">

  <div id="loading" class="loading">読み込んでいます…</div>
  <div id="boot-status" class="status" hidden></div>

  <div id="form-area" hidden>
    <h1>カジュアル面談の日程調整</h1>
    <p class="lead">面談の日程をお選びください。3つだけ教えていただければ完了です。</p>

    <div class="field">
      <label for="name">氏名（ふりがな）<span class="req">必須</span></label>
      <input type="text" id="name" autocomplete="name" placeholder="やまだ たろう">
    </div>

    <div class="field">
      <label for="email">連絡先メールアドレス<span class="req">必須</span></label>
      <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="example@gmail.com">
    </div>

    <div class="field">
      <label for="planDate">面談のご希望日程<span class="req">必須</span></label>
      <select id="planDate"><option value="">読み込んでいます…</option></select>
      <p class="note">面談は22:00〜23:00の枠です。オンライン（Zoom）で行います。</p>
    </div>

    <button id="submit" type="button">この日程で予約する</button>
    <div id="status" class="status" hidden></div>
  </div>

  <div id="done" class="done" hidden>
    <h2>カジュアル面談の<br>ご予約を受け付けました</h2>
    <p id="done-when"></p>
    <!-- ★2026-09-25 守屋＝申込が終わったら「カレンダー追加」と「Zoom」の2つのリンクを出す（合説の申込後と同じ形）。
         Zoom の URL は公開リポジトリに置かず、日程と一緒に GAS（doGet kind=面接 の zoom）から受け取る。
         取れなかったときはボタンごと出さず、下の一文で LINE の案内に寄せる（押せないボタンを見せない）。 -->
    <div class="done-links">
      <a id="cal-link" href="#" hidden>📅 Googleカレンダーに追加する<small>日時とZoomのURLが予定に入ります</small></a>
      <a id="zoom-link" href="#" hidden>💻 当日のZoomを開く<small>時間になったらここから入ってください</small></a>
    </div>
    <p id="done-note">当日のZoomリンクは、前日までにLINEでお送りします。<br>このページは閉じていただいて大丈夫です。</p>
  </div>

</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="../config.js"></script>
<script src="../assets/liff-common.js"></script>
<script>
(function () {
  'use strict';
  var profile = null, src = 'unknown', sending = false;

  RVSS.boot({
    liffKey: 'interview',
    onReady: function (p, s) {
      profile = p; src = s;
      RVSS.show('form-area');
      // ★2026-09-26｜予約ページを開いたことを視聴ログへ残す（「開いたのに予約しなかった」を数えるため）。落ちても予約は止めない。
      if (p && p.userId) {
        RVSS.postToGas({ kind: 'watch', event: 'form', pct: '', src: s, lineUserId: p.userId,
          lineDisplayName: p.displayName || '', email: '' }).catch(function () {});
      }
      // 日程は「予定」タブの種別＝面接 を読む（2026-09-25 Daichi：画面上の呼び方は「カジュアル面談」、枠は面接のまま）
      RVSS.fillDates(document.getElementById('planDate'), '面接')
        .then(function (n) {
          if (!n) {
            RVSS.setStatus('いま予約できる枠がありません。お手数ですがLINEでご連絡ください。', 'err');
            document.getElementById('submit').disabled = true;
          }
        })
        .catch(function () {
          RVSS.setStatus('日程の読み込みに失敗しました。開き直すか、LINEでご連絡ください。', 'err');
          document.getElementById('submit').disabled = true;
        });
    }
  });

  /* 完了画面の2つのリンク。選んだ枠（"9/28(月) 22:00〜23:00"＋date=2026-09-28）から日本時間で予定を組む。 */
  function showDoneLinks(planDate) {
    var sch = RVSS.lastSchedule || {};
    var item = (sch.items || []).filter(function (x) { return x.value === planDate; })[0];
    var zoom = /^https:\/\/[a-z0-9.-]*zoom\.us\//i.test(sch.zoom || '') ? sch.zoom : '';
    document.getElementById('done-when').textContent = planDate + '（オンライン・Zoom）';
    var m = item && item.date && /(\d{1,2}):(\d{2})\s*[〜~～-]\s*(\d{1,2}):(\d{2})/.exec(item.label || item.value);
    if (m) {
      var ymd = item.date.replace(/-/g, '');
      var hm = function (h, mi) { return ('0' + h).slice(-2) + mi + '00'; };
      var cal = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text=' + encodeURIComponent('RVSS カジュアル面談')
        + '&dates=' + ymd + 'T' + hm(m[1], m[2]) + '/' + ymd + 'T' + hm(m[3], m[4])
        + '&ctz=Asia%2FTokyo'
        + '&details=' + encodeURIComponent('RVSSのメンバーとオンラインで話すカジュアル面談です。' + (zoom ? '\nZoom: ' + zoom : ''))
        + (zoom ? '&location=' + encodeURIComponent(zoom) : '');
      linkOut('cal-link', cal);
    }
    if (zoom) {
      linkOut('zoom-link', zoom);
      document.getElementById('done-note').innerHTML = '当日は上のZoomから入ってください。<br>このページは閉じていただいて大丈夫です。';
    }
  }
  // LINE の中のブラウザではなく、端末の既定ブラウザ（Zoom はアプリ）で開く
  function linkOut(id, url) {
    var a = document.getElementById(id);
    a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.hidden = false;
    a.addEventListener('click', function (e) {
      if (window.liff && liff.isInClient && liff.isInClient()) { e.preventDefault(); liff.openWindow({ url: url, external: true }); }
    });
  }

  document.getElementById('submit').addEventListener('click', function () {
    if (sending) return;
    var name = document.getElementById('name').value.trim();
    var email = document.getElementById('email').value.trim();
    var planDate = document.getElementById('planDate').value;

    if (!name) { return RVSS.setStatus('氏名（ふりがな）を入力してください。', 'err'); }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { return RVSS.setStatus('メールアドレスの形式をご確認ください。', 'err'); }
    if (!planDate) { return RVSS.setStatus('ご希望の日程を選んでください。', 'err'); }

    sending = true;
    var btn = document.getElementById('submit');
    btn.disabled = true; btn.textContent = '送信しています…';
    RVSS.setStatus('送信しています…', '');

    RVSS.postToGas({
      kind: 'interview',
      name: name,
      email: email,
      interviewDate: planDate,
      planDate: planDate,
      src: src,
      lineUserId: (profile && profile.userId) || '',
      lineDisplayName: (profile && profile.displayName) || ''
    }).then(function () {
      RVSS.hide('form-area');
      showDoneLinks(planDate);
      RVSS.show('done');
    }).catch(function () {
      sending = false;
      btn.disabled = false; btn.textContent = 'もう一度送る';
      RVSS.setStatus('送信を確認できませんでした。もう一度お試しください。それでも進まない場合はLINEでお知らせください。', 'err');
    });
  });
})();
</script>
</body>
</html>
