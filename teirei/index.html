<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RVSS 土曜定例の体験参加</title>
<link rel="stylesheet" href="../assets/common.css">
</head>
<body>
<div class="wrap">

  <div id="loading" class="loading">読み込んでいます…</div>
  <div id="boot-status" class="status" hidden></div>

  <div id="form-area" hidden>
    <h1>土曜定例の体験参加</h1>
    <p class="lead">公式LINEにご登録いただいている方へのご案内です。実際の定例に参加して、RVSSの活動をそのまま見ていただけます。</p>

    <div class="field">
      <label for="name">お名前<span class="req">必須</span></label>
      <input type="text" id="name" autocomplete="name" placeholder="山田 太郎">
    </div>

    <div class="field">
      <label for="school">大学・学年<span class="req">必須</span></label>
      <input type="text" id="school" placeholder="東京理科大学 2年">
    </div>

    <div class="field">
      <label for="email">メールアドレス<span class="req">必須</span></label>
      <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="example@gmail.com">
      <p class="note">ご連絡に使います。普段お使いのものをお願いします。</p>
    </div>

    <div class="field">
      <label for="planDate">参加ご希望日<span class="req">必須</span></label>
      <select id="planDate"><option value="">読み込んでいます…</option></select>
    </div>

    <div class="field">
      <label for="source">どこでRVSSを知りましたか<span class="req">必須</span></label>
      <select id="source">
        <option value="">選んでください</option>
        <option>知人からの紹介</option>
        <option>RVSSイベント</option>
        <option>SNS(RVSS公式)</option>
        <option>REALVALUE本編(インフォマ)</option>
        <option>ビラ</option>
        <option>その他</option>
      </select>
    </div>

    <!-- ★2026-09-09 追加。オコエさん承認済み（LINEグループ 11:24「いいよ」）。
         「見込みの人が顔出しするなら、既存メンバーの顔出しできない人は本当に無くしたい」（オコエさん 11:29）
         なので、来る側にも先に約束してもらう。必須チェック。 -->
    <label class="agree" for="faceOn">
      <input type="checkbox" id="faceOn">
      <span>土曜定例への体験参加は、<b>カメラON・顔出しが必須</b>であることを確認しました<span class="req">必須</span></span>
    </label>

    <p class="note" style="margin:-8px 0 18px">当日は<b>9:10</b>にご入室ください。定例の流れと最低限の規律について、担当からご説明します。</p>

    <button id="submit" type="button">この内容で申し込む</button>
    <div id="status" class="status" hidden></div>
  </div>

  <div id="done" class="done" hidden>
    <h2>お申し込みを受け付けました</h2>
    <p>当日の詳細は、LINEでご連絡します。</p>

    <!-- ★config が空ならボタンごと出さない（空リンクを見せない）。 -->
    <div id="done-links" class="done-links" hidden>
      <a id="zoom-link" href="#" target="_blank" rel="noopener" hidden>当日のZoomに入る<small>開始15分前（9:10）にご入室ください</small></a>
      <a id="cal-link" href="#" target="_blank" rel="noopener" hidden>カレンダーに追加する<small>Googleカレンダーが開きます</small></a>
    </div>
    <!-- ★mendan と同じ仕掛け。押すとLステップ側で「採用フロー中」タグが付き、広報のシナリオ配信から外れる。
         2026-09-08 の広報戦略定例で「申込が来た人全員にタグを付ける（広報のリマインドと重ならないように）」と決まっている。
         LSTEP_TAG_URL が空のときはボタンごと出さない。 -->
    <div id="confirm-wrap" hidden style="margin-top:26px">
      <button id="confirm-link" type="button">申込内容を確認する</button>
    </div>
  </div>

</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="../config.js"></script>
<script src="../assets/liff-common.js"></script>
<script>
(function () {
  'use strict';
  var profile = null, src = 'unknown', sending = false;

  RVSS.boot({
    liffKey: 'teirei',
    onReady: function (p, s) {
      profile = p; src = s;
      RVSS.show('form-area');
      // 日程は「予定」タブの種別＝土曜定例 を読む。
      // ★枠を足すのは採用側（予定タブに1行足すだけ）。フォームは触らない。
      RVSS.fillDates(document.getElementById('planDate'), '土曜定例')
        .then(function (n) {
          if (!n) {
            // ★mendan と違い、ここは「日程が無ければ申し込めない」でよい。
            //   体験参加は特定の回に来てもらうもので、あとからLINEで調整する性質のものではない。
            RVSS.setStatus('現在ご案内できる回がありません。近日中にLINEでご案内しますので、少々お待ちください。', 'err');
            document.getElementById('submit').disabled = true;
          }
        })
        .catch(function () {
          RVSS.setStatus('日程の読み込みに失敗しました。お手数ですが、時間をおいてもう一度お開きください。', 'err');
          document.getElementById('submit').disabled = true;
        });
    }
  });

  // チェックが入ったら枠を緑にする（押せたことが分かるように）
  document.getElementById('faceOn').addEventListener('change', function () {
    this.closest('.agree').classList.toggle('on', this.checked);
  });

  document.getElementById('submit').addEventListener('click', function () {
    if (sending) return;
    var name = document.getElementById('name').value.trim();
    var school = document.getElementById('school').value.trim();
    var email = document.getElementById('email').value.trim();
    var planDate = document.getElementById('planDate').value;
    var source = document.getElementById('source').value;
    var faceOn = document.getElementById('faceOn').checked;

    if (!name) { return RVSS.setStatus('お名前を入力してください。', 'err'); }
    if (!school) { return RVSS.setStatus('大学・学年を入力してください。', 'err'); }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { return RVSS.setStatus('メールアドレスの形式をご確認ください。', 'err'); }
    if (!planDate) { return RVSS.setStatus('参加ご希望日を選んでください。', 'err'); }
    if (!source) { return RVSS.setStatus('どこでRVSSを知ったかを選んでください。', 'err'); }
    if (!faceOn) { return RVSS.setStatus('カメラON・顔出し必須の確認にチェックをお願いします。', 'err'); }

    sending = true;
    var btn = document.getElementById('submit');
    btn.disabled = true; btn.textContent = '送信しています…';
    RVSS.setStatus('送信しています…', '');

    RVSS.postToGas({
      kind: 'teirei',
      name: name,
      school: school,
      email: email,
      planDate: planDate,
      source: source,
      faceOn: faceOn ? 'はい' : '',
      src: src,
      lineUserId: (profile && profile.userId) || '',
      lineDisplayName: (profile && profile.displayName) || ''
    }).then(function () {
      RVSS.hide('form-area');
      RVSS.show('done');
      if (window.RVSS_CONFIG.LSTEP_TAG_URL) RVSS.show('confirm-wrap');
      showDoneLinks();
    }).catch(function () {
      sending = false;
      btn.disabled = false; btn.textContent = 'もう一度送る';
      RVSS.setStatus('送信を確認できませんでした。もう一度お試しください。それでも進まない場合はLINEでお知らせください。', 'err');
    });
  });

  // Zoom・カレンダーは config に入っているものだけ出す。
  function showDoneLinks() {
    var any = false;
    [['TEIREI_ZOOM_URL', 'zoom-link'], ['TEIREI_CALENDAR_URL', 'cal-link']].forEach(function (pair) {
      var url = window.RVSS_CONFIG[pair[0]];
      if (!url) return;
      var a = document.getElementById(pair[1]);
      a.href = url; a.hidden = false; any = true;
    });
    if (any) RVSS.show('done-links');
  }

  document.getElementById('confirm-link').addEventListener('click', function () {
    var url = window.RVSS_CONFIG.LSTEP_TAG_URL;
    if (!url) return;
    if (typeof liff !== 'undefined' && liff.openWindow) {
      liff.openWindow({ url: url, external: false });
    } else {
      location.href = url;
    }
  });
})();
</script>
</body>
</html>
